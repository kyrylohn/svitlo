<script src="config.js"></script>
<script>
"use strict";
/* Налаштування — у config.js. Для перевірки іншої черги без правок: ?r=kyiv&q=GPV3.1 (лише графік, без даних будинку). */
const QS = new URLSearchParams(location.search);
const C = Object.assign({ title: "Світло", group: "", provider: "", region: "", groupKey: "", dataUrl: "", sensorNote: "датчик у будинку",
  emergencyName: "", emergencyUrl: "", notify: "", chatUrl: "", chatName: "Чат будинку в Telegram", tz: "Europe/Kyiv" }, window.SVITLO || {});
const TRY = /^[\w-]+$/.test(QS.get("r") || "") || /^[\w.]+$/.test(QS.get("q") || "");
if (TRY) {
  if (/^[\w-]+$/.test(QS.get("r") || "")) C.region = QS.get("r");
  if (/^[\w.]+$/.test(QS.get("q") || "")) { C.groupKey = QS.get("q"); C.group = C.groupKey.replace(/^GPV/, ""); }
  C.dataUrl = ""; C.provider = ""; C.emergencyName = ""; C.emergencyUrl = ""; C.chatUrl = "";
}
const DATA_LOCAL = QS.get("data"); // лише для тесту: локальний *.json того ж сайту
const DATA_URL = DATA_LOCAL && /^[\w.-]+\.json$/.test(DATA_LOCAL) ? DATA_LOCAL : C.dataUrl;
const HAS_HOME = !!DATA_URL;
const OD_URL = C.region && C.groupKey ? `https://raw.githubusercontent.com/Baskerville42/outage-data-ua/main/data/${encodeURIComponent(C.region)}.json` : "";
const CACHE = "svitlo-data-v1";
const TZ = C.tz;
const TYPES = {
  p: { name: "За графіком", color: "#6B7488" },
  e: { name: "Екстрені", color: "#FF6B5E" },
  n: { name: "Поза графіком", color: "#FF9A6B" },
  u: { name: "Невідомо", color: "#3A4252" },
};
const ORDER = ["p", "e", "n", "u"];
const DN = ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const DNF = ["неділя", "понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота"];
const MN = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");

/* ---------- час за Києвом ---------- */
const FMT = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" });
const WD = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
function kp(sec) {
  const o = {};
  for (const p of FMT.formatToParts(new Date(sec * 1000))) o[p.type] = p.value;
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, wd: WD[o.weekday] };
}
function kMid(y, m, d) { // epoch-секунди київської півночі дати y-m-d (m 1..12, d може виходити за межі місяця)
  const u = new Date(Date.UTC(y, m - 1, d)); y = u.getUTCFullYear(); m = u.getUTCMonth() + 1; d = u.getUTCDate();
  const want = Date.UTC(y, m - 1, d) / 1000;
  let t = want;
  for (let i = 0; i < 3; i++) { const p = kp(t); t += want - Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi) / 1000; }
  return t;
}
const hm = (sec) => { const p = kp(sec); return `${pad(p.h)}:${pad(p.mi)}`; };
const dm = (sec) => { const p = kp(sec); return `${pad(p.d)}.${pad(p.m)}`; };
const hmm = (m) => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const dur = (sec) => {
  const m = Math.round(sec / 60);
  if (m < 60) return `${Math.max(m, 1)} хв`;
  const h = Math.floor(m / 60), r = m % 60;
  return `${h} год${r ? ` ${r} хв` : ""}`;
};
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? b : c);
const nowS = () => Date.now() / 1000;
const ts = (iso) => (iso ? Date.parse(iso) / 1000 : null);

/* ---------- стан ---------- */
let D = null, period = 7, selDay = null, showAll = false, schedDay = 0, lastFetchOk = 0;
const fixed = (x) => (x == null ? null : x);

/* ---------- завантаження ---------- */
async function load(manual) {
  const btn = $("refresh");
  btn.classList.add("spin");
  try {
    if (HAS_HOME) {
      const r = await fetch(`${DATA_URL}?t=${Math.floor(Date.now() / 30000)}`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (!D || !D.generated || (d.generated || 0) >= D.generated) { D = d; try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {} }
      lastFetchOk = Date.now();
    } else if (!D) D = { v: 1 };
    // графік прямо з outage-data-ua — якщо дім його не надіслав (або сторінка без даних будинку)
    if (OD_URL && !(D.grafik && D.grafik.ok) && (manual || Date.now() - odAt > 5 * 60000)) await loadOD();
  } catch (e) {
    if (manual) $("upd").textContent = "Немає звʼязку";
  } finally {
    btn.classList.remove("spin");
    render();
  }
}

/* ---------- графік з відкритих даних github.com/Baskerville42/outage-data-ua ----------
 * fact.data: { "<epoch київської півночі>": { "GPV5.1": { "1": "yes" | "no" | "first" | "second" | "maybe" | "mfirst" | "msecond", … "24": … } } }
 * година i — хвилини [(i-1)·60, i·60); no/first/second — відключення (вся година / перші / другі 30 хв), maybe/m* — можливе. */
let G = null, odAt = 0;
async function loadOD() {
  odAt = Date.now();
  try {
    const r = await fetch(OD_URL);
    if (!r.ok) throw new Error(r.status);
    G = odParse(await r.json()) || G;
  } catch (e) {}
}
function odParse(c) {
  const data = c && c.fact && c.fact.data;
  if (!data) return null;
  const p = kp(nowS());
  const day = (t0) => {
    const h = (data[String(t0)] || {})[C.groupKey];
    if (!h) return null;
    const out = [];
    for (let i = 1; i <= 24; i++) {
      const v = String(h[i] || "yes"), a = (i - 1) * 60, t = v[0] === "m" ? "i" : "p";
      const r = v === "no" || v === "maybe" ? [a, a + 60] : v === "first" || v === "mfirst" ? [a, a + 30] : v === "second" || v === "msecond" ? [a + 30, a + 60] : null;
      if (!r) continue;
      const l = out[out.length - 1];
      if (l && l.e === r[0] && l.t === t) l.e = r[1]; else out.push({ s: r[0], e: r[1], t });
    }
    return out;
  };
  const today = day(kMid(p.y, p.m, p.d)), tomorrow = day(kMid(p.y, p.m, p.d + 1));
  return { date: `${p.y}-${pad(p.m)}-${pad(p.d)}`, today, tomorrow, tomorrow_status: tomorrow ? "schedule_applies" : "waiting_for_schedule",
    dzherelo: "outage-data-ua", onovleno: (c.fact && c.fact.update) || "", ok: !!(today || tomorrow),
    noGroup: !Object.values(data).some((d) => d && d[C.groupKey]) };
}
const gf = () => (D && D.grafik && D.grafik.ok ? D.grafik : G || (D && D.grafik) || {});
const hasSensor = () => !!D && ["on", "off", "unknown", "unavailable"].includes(D.svitlo);
// планові відключення сьогодні+завтра в epoch-секундах, злиті (і через північ)
function planned() {
  const g = gf(), [gy, gm, gd] = (g.date || "").split("-").map(Number), out = [];
  if (!gy) return out;
  [g.today, g.tomorrow].forEach((l, k) => { if (Array.isArray(l)) { const b = kMid(gy, gm, gd + k); for (const x of l) if (x.t === "p") out.push({ s: b + x.s * 60, e: b + x.e * 60 }); } });
  out.sort((a, b) => a.s - b.s);
  const m = [];
  for (const x of out) { const l = m[m.length - 1]; if (l && x.s <= l.e) l.e = Math.max(l.e, x.e); else m.push({ ...x }); }
  return m;
}

/* ---------- розрахунки ---------- */
function journal() {
  const list = (D.zhurnal || []).map((x) => ({ s: +x.s, e: +x.e, t: TYPES[x.t] ? x.t : "u" }));
  if (D.svitlo === "off" && D.pochatok > 0) list.push({ s: D.pochatok, e: nowS(), t: TYPES[D.typ] ? D.typ : "u", live: true });
  return list.sort((a, b) => a.s - b.s);
}

function render() {
  if (!D) return;
  $("hero").classList.remove("skel");
  const now = nowS(), gen = D.generated || 0, age = now - gen;
  const sens = hasSensor();
  $("statsCard").style.display = $("histCol").style.display = sens ? "" : "none";
  if (HAS_HOME) $("upd").textContent = gen ? `Дані на ${hm(gen)}${dm(gen) !== dm(now) ? ` ${dm(gen)}` : ""}` : "";
  else $("upd").textContent = gf().onovleno ? `Графік від ${String(gf().onovleno).replace(/^(\d\d\.\d\d)\.\d{4}/, "$1")}` : "";
  const st = $("stale");
  if (HAS_HOME && gen && age > 20 * 60) {
    st.style.display = "block";
    st.textContent = `Будинок не надсилав дані ${dur(age)} — можливо, немає інтернету. Показано останнє відоме.`;
  } else st.style.display = "none";
  hero(now);
  sched(now);
  stats(now);
}

function hero(now) {
  const off = D.svitlo === "off" && D.pochatok > 0;
  const zh = D.zhurnal || [];
  const h1 = $("h1"), hp = $("hp");
  const ty = { p: "за графіком", e: "екстрене", n: "поза графіком" }[D.typ] || "";
  const pl = planned(), cur = pl.find((x) => x.s <= now && x.e > now), nxt = pl.find((x) => x.s > now);
  const av = ts(D.avariika && D.avariika.do);
  const nx = ts(D.nastupne) || (nxt ? nxt.s : null), vk = ts(D.vkliuchennia) || (cur ? cur.e : nxt ? nxt.e : null);
  const t0 = kMid(kp(now).y, kp(now).m, kp(now).d);
  let todaySec = 0;
  for (const x of journal()) if (x.e > t0) todaySec += Math.min(x.e, now) - Math.max(x.s, t0);
  const sh = `Сьогодні без світла ${todaySec > 30 ? dur(todaySec) : "0 хв"}.`;
  const when = (t) => { const a = kp(t), b = kp(now); const dd = Math.round((kMid(a.y, a.m, a.d) - kMid(b.y, b.m, b.d)) / 86400); return `${dd === 0 ? "сьогодні" : dd === 1 ? "завтра" : dm(t)} о ${hm(t)}`; };
  if (!hasSensor()) { // лише графік, без датчика
    const g = gf();
    if (!g.ok) { h1.className = ""; h1.textContent = "Немає даних графіка"; hp.textContent = g.noGroup ? `Черги ${C.groupKey} немає у файлі регіону «${C.region}».` : "Не вдалося завантажити графік. Спробуйте оновити."; return; }
    if (cur) { h1.className = "off"; h1.textContent = "За графіком зараз відключення"; hp.textContent = `Світло має зʼявитися ${when(cur.e)}.${nxt ? ` Наступне відключення — ${when(nxt.s)}, до ${hm(nxt.e)}.` : ""}`; }
    else { h1.className = ""; h1.textContent = "За графіком світло є"; hp.textContent = nxt ? `Наступне відключення — ${when(nxt.s)}, до ${hm(nxt.e)}.` : "Найближчим часом відключень за графіком немає."; }
    return;
  }
  if (D.svitlo === "unknown" || D.svitlo === "unavailable") {
    h1.className = ""; h1.textContent = "Невідомо, чи є світло"; hp.textContent = "Датчик у щитку зараз не відповідає. " + sh; return;
  }
  if (off) {
    h1.className = "off"; h1.textContent = `Світла немає ${dur(now - D.pochatok)}`;
    let s = `Зникло о ${hm(D.pochatok)}${dm(D.pochatok) !== dm(now) ? ` (${dm(D.pochatok)})` : ""}${ty ? `, відключення ${ty}` : ""}.`;
    if (av && av > now) s += ` За «${C.emergencyName || "Аварійка"}» — до ${hm(av)}${D.avariika.mozhlyve_podovzhennia ? " (можливе подовження)" : ""}.`;
    else if (vk && vk > now) s += ` За графіком включення ${when(vk)}.`;
    hp.textContent = `${s} ${sh}`;
  } else {
    h1.className = ""; h1.textContent = zh.length ? `Світло є ${dur(now - zh[zh.length - 1].e)}` : "Світло є";
    let s = sh;
    if (nx && nx > now) s += ` Наступне відключення за графіком — ${when(nx)}${vk && vk > nx ? `, до ${hm(vk)}` : ""}.`;
    else s += " Найближчим часом відключень за графіком немає.";
    hp.textContent = s;
  }
}

function sched(now) {
  const g = gf();
  const today = kp(now);
  // дані графіка — на дату експорту; якщо минула північ, «завтра» експорту стало «сьогодні»
  const [gy, gm, gd] = (g.date || "").split("-").map(Number);
  const shift = gy ? Math.round((kMid(today.y, today.m, today.d) - kMid(gy, gm, gd)) / 86400) : 0;
  const pick = (k) => { const i = k + shift; return i === 0 ? g.today : i === 1 ? g.tomorrow : null; };
  document.querySelectorAll("#schedTabs button").forEach((b) => b.classList.toggle("on", +b.dataset.d === schedDay));
  const t0 = kMid(today.y, today.m, today.d + schedDay);
  const p = kp(t0 + 3600);
  $("sTitle").innerHTML = `${schedDay ? "Завтра" : "Сьогодні"} <em>${DNF[p.wd]}, ${p.d} ${MN[p.m - 1]}</em>`;
  const spans = pick(schedDay);
  const bar = $("sBar"), pct = (m) => `${((m / 1440) * 100).toFixed(3)}%`;
  let html = "", list = "", sum = 0;
  if (Array.isArray(spans)) {
    const pl = spans.filter((x) => x.t === "p").sort((a, b) => a.s - b.s);
    for (const x of pl) { html += `<i class="p" style="left:${pct(x.s)};width:${pct(x.e - x.s)}"></i>`; sum += x.e - x.s; }
    list = pl.length ? pl.map((x) => `${hmm(x.s)}–${x.e >= 1440 ? "24:00" : hmm(x.e)}`).join(", ") : "Відключень за графіком немає";
    bar.classList.remove("none");
  } else {
    bar.classList.add("none");
    list = g.noGroup ? `Черги ${C.groupKey} немає у даних регіону` : schedDay && (g.tomorrow_status === "waiting_for_schedule" || !g.tomorrow || !g.tomorrow.length) ? "Графік на завтра ще не оприлюднено" : "Немає даних графіка";
  }
  // екстрене зараз: від зникнення світла до часу з Аварійки
  const av = ts(D.avariika && D.avariika.do);
  let avTxt = "";
  if (!schedDay && D.svitlo === "off" && D.pochatok > 0) {
    const a = Math.max(0, (D.pochatok - t0) / 60), b = Math.min(1440, ((av && av > now ? av : now) - t0) / 60);
    if (b > a) html += `<i class="x" style="left:${pct(a)};width:${pct(b - a)}"></i>`;
    avTxt = av && av > now ? `Екстрені до ${hm(av)}` : D.typ === "e" ? "Екстрене відключення" : "";
  }
  if (!schedDay) {
    const m = (now - t0) / 60;
    html += `<i class="past" style="width:${pct(m)}"></i><i class="now" style="left:${pct(m)}"></i>`;
  }
  bar.innerHTML = html + '<i class="g"></i>';
  $("sList").textContent = list;
  $("sSum").textContent = Array.isArray(spans) && sum ? `без світла ${dur(sum * 60)}` : "";
  $("sAv").textContent = avTxt;
  if (avTxt && C.emergencyName && TG_RE.test(C.emergencyUrl)) {
    const a = document.createElement("a"); a.href = C.emergencyUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = `«${C.emergencyName}»`;
    a.onclick = () => tclick("avariika");
    $("sAv").append(" · джерело — ", a);
  }
}

function stats(now) {
  const list = journal();
  document.querySelectorAll("#per button").forEach((b) => b.classList.toggle("on", +b.dataset.p === period));
  const tp = kp(now);
  const todayMid = kMid(tp.y, tp.m, tp.d);
  const firstP = list.length ? kp(list[0].s) : tp;
  const firstMid = kMid(firstP.y, firstP.m, firstP.d);
  let F = period ? kMid(tp.y, tp.m, tp.d - (period - 1)) : firstMid;
  const days = [];
  for (let i = 0; ; i++) {
    const p0 = kp(F + 3600);
    const t0 = kMid(p0.y, p0.m, p0.d + i), t1 = kMid(p0.y, p0.m, p0.d + i + 1);
    if (t0 > todayMid) break;
    const p = kp(t0 + 3600);
    days.push({ k: `${p.y}-${p.m}-${p.d}`, p, t0, t1, segs: [], sum: { p: 0, e: 0, n: 0, u: 0 }, tot: 0 });
    if (i > 400) break;
  }
  const inP = list.filter((x) => x.e > F);
  for (const x of inP) for (const d of days) {
    const s = Math.max(x.s, d.t0), e = Math.min(x.e, d.t1);
    if (e > s) { d.segs.push({ s, e, t: x.t }); d.sum[x.t] += e - s; d.tot += e - s; }
  }
  const span = Math.max(1, Math.min(now, days[days.length - 1].t1) - F);
  const tot = days.reduce((a, d) => a + d.tot, 0), n = inP.length;
  const live = list.some((x) => x.live);
  $("tot").textContent = tot ? dur(tot) : "0 хв";
  $("sub").textContent = n ? `${Math.round((tot / span) * 100)} % часу · ${n} ${plural(n, "відключення", "відключення", "відключень")}${live ? " · зараз світла немає" : ""}` : "Відключень не було";
  let longest = null;
  for (const x of inP) { const s = Math.max(x.s, F), e = Math.min(x.e, now); if (!longest || e - s > longest.e - longest.s) longest = { s, e, live: x.live }; }
  let gap = null, prevE = F;
  for (const x of inP) { if (x.s - prevE > (gap ? gap.e - gap.s : 0)) gap = { s: prevE, e: x.s }; prevE = Math.max(prevE, x.e); }
  if (!live && now - prevE > (gap ? gap.e - gap.s : 0)) gap = { s: prevE, e: now, live: true };
  const fullDays = Math.max(1, span / 86400);
  const kd = (x) => (x ? `${DN[kp(x.s).wd]} ${dm(x.s)}${x.live ? " · триває" : ""}` : "—");
  $("kpi").innerHTML = `
    <div><span>Найдовше без світла</span><b>${longest ? dur(longest.e - longest.s) : "—"}</b><em>${kd(longest)}</em></div>
    <div><span>Найдовше зі світлом</span><b>${gap ? dur(gap.e - gap.s) : "—"}</b><em>${gap ? (gap.s > F ? kd(gap) : "з початку періоду") : "—"}</em></div>
    <div><span>Середньо за добу</span><b>${(tot / fullDays / 3600).toFixed(1).replace(".", ",")} год</b><em>${n ? `${(n / fullDays).toFixed(1).replace(".", ",")} відкл./добу` : "—"}</em></div>`;
  chart(days);
  const used = ORDER.filter((t) => days.some((d) => d.sum[t] > 0));
  $("legend").innerHTML = used.map((t) => `<span><i style="background:${TYPES[t].color}"></i>${TYPES[t].name}</span>`).join("");
  const byT = ORDER.map((t) => ({ t, v: days.reduce((a, d) => a + d.sum[t], 0), c: inP.filter((x) => x.t === t).length })).filter((x) => x.v > 0);
  const mx = Math.max(1, ...byT.map((x) => x.v));
  $("types").innerHTML = byT.map((x) => `<div class="row"><span class="t"><b>${TYPES[x.t].name}</b> · ${x.c} ${plural(x.c, "раз", "рази", "разів")}</span><span class="v">${dur(x.v)}</span><div class="b"><span style="width:${(x.v / mx) * 100}%;background:${TYPES[x.t].color}"></span></div></div>`).join("");
  // смуги
  const pc = (v) => `${((v / 86400) * 100).toFixed(3)}%`;
  const byKey = Object.fromEntries(days.map((d) => [d.k, d]));
  $("days").innerHTML = [...days].reverse().map((d) => {
    const L = d.t1 - d.t0;
    const p2 = (v) => `${((v / L) * 100).toFixed(3)}%`;
    const fut = d.t1 > now ? `<i class="f" style="left:${p2(now - d.t0)};right:0"></i>` : "";
    return `<div class="day${selDay === d.k ? " sel" : ""}" data-k="${d.k}"><div class="h"><b>${DN[d.p.wd]} ${pad(d.p.d)}.${pad(d.p.m)}</b><span>${d.tot ? dur(d.tot) : "без відключень"}</span></div>
      <div class="strip">${d.segs.map((s) => `<i class="${s.t}" style="left:${p2(s.s - d.t0)};width:${p2(s.e - s.s)}"></i>`).join("")}${fut}<i class="g"></i></div></div>`;
  }).join("");
  document.querySelectorAll(".day").forEach((el) => (el.onclick = () => { selDay = selDay === el.dataset.k ? null : el.dataset.k; tclick("day"); render(); }));
  // журнал
  let rows = inP.slice().reverse();
  if (selDay && byKey[selDay]) { const d = byKey[selDay]; rows = rows.filter((x) => x.e > d.t0 && x.s < d.t1); }
  const LIM = 12, cut = !showAll && !selDay && rows.length > LIM, vis = cut ? rows.slice(0, LIM) : rows;
  $("jrSub").textContent = selDay && byKey[selDay] ? `${pad(byKey[selDay].p.d)}.${pad(byKey[selDay].p.m)} · тап по дню — скинути` : `${rows.length} ${plural(rows.length, "запис", "записи", "записів")}`;
  let html = "", lastK = "";
  for (const x of vis) {
    const p = kp(x.s), k = `${p.y}-${p.m}-${p.d}`;
    if (k !== lastK) { html += `<div class="d"><span>${DN[p.wd]} ${dm(x.s)}</span><span>${byKey[k] ? dur(byKey[k].tot) : ""}</span></div>`; lastK = k; }
    const end = x.live ? '<span class="live">триває</span>' : `${hm(x.e)}${dm(x.e) !== dm(x.s) ? ` <small>${dm(x.e)}</small>` : ""}`;
    html += `<span class="tm">${hm(x.s)} – ${end}</span><span class="ty"><i style="background:${TYPES[x.t].color}"></i>${TYPES[x.t].name}</span><span class="du">${dur(x.e - x.s)}</span>`;
  }
  $("jr").innerHTML = (vis.length ? `<div class="log">${html}</div>` : '<div class="empty">Відключень не було</div>') + (cut ? `<button class="more" id="more">Показати всі (${rows.length})</button>` : "");
  if (cut) $("more").onclick = () => { showAll = true; tclick("more"); render(); };
}

function chart(days) {
  const svg = $("chart");
  const W = 340, H = 130, X0 = 26, n = days.length, bw = (W - X0) / n;
  const maxH = Math.max(6, Math.ceil(Math.max(...days.map((d) => d.tot / 3600)) / 6) * 6);
  const y = (h) => H - (h / maxH) * H;
  let g = "";
  for (let h = 0; h <= maxH; h += maxH / 2) g += `<line x1="${X0}" x2="${W}" y1="${y(h)}" y2="${y(h)}" stroke="#323B4C" stroke-width="1"/><text x="0" y="${y(h) + 4}">${h} г</text>`;
  const step = n <= 8 ? 1 : n <= 16 ? 2 : Math.ceil(n / 7);
  days.forEach((d, i) => {
    let acc = 0;
    const x = X0 + i * bw + bw * 0.15, w = Math.max(2, bw * 0.7);
    for (const t of ORDER) {
      const v = d.sum[t] / 3600;
      if (v <= 0) continue;
      g += `<rect x="${x}" y="${y(acc + v)}" width="${w}" height="${Math.max(1, (v / maxH) * H)}" fill="${TYPES[t].color}" rx="${n > 20 ? 1 : 3}"/>`;
      acc += v;
    }
    if (selDay === d.k) g += `<rect x="${x - 2}" y="-4" width="${w + 4}" height="${H + 8}" fill="none" stroke="#9A7CFF" stroke-width="1.5" rx="4"/>`;
    if (i % step === 0 || i === n - 1) g += `<text x="${x + w / 2}" y="${H + 16}" text-anchor="middle">${n <= 8 ? DN[d.p.wd] : `${pad(d.p.d)}.${pad(d.p.m)}`}</text>`;
    g += `<rect data-k="${d.k}" x="${X0 + i * bw}" y="0" width="${bw}" height="${H + 18}" fill="transparent" style="cursor:pointer"/>`;
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${H + 22}`);
  svg.innerHTML = g;
  svg.querySelectorAll("rect[data-k]").forEach((el) => (el.onclick = () => { selDay = selDay === el.dataset.k ? null : el.dataset.k; tclick("day"); render(); }));
}

/* ---------- чи користуються сторінкою (Worker svitlo-notify → Telegram) ----------
 * Не збираємо IP чи імена: лише випадковий id у браузері (новий / повторний), звідки прийшли, скільки часу й що натискали.
 * Свої пристрої: відкрити сторінку з ?me=1 (?me=0 — скасувати). */
const NOTIFY = TRY || DATA_LOCAL ? "" : C.notify; // Worker з папки worker/ (config.js → notify)
const TR = { clicks: new Set(), ref: null, visible: 0, since: document.hidden ? 0 : Date.now(), scroll: 0, sent: false };
const tclick = (c) => TR.clicks.add(c);
(function track() {
  const qs = new URLSearchParams(location.search);
  try {
    if (qs.get("me") === "1") localStorage.setItem("svitlo-me", "1");
    if (qs.get("me") === "0") localStorage.removeItem("svitlo-me");
  } catch (e) {}
  if (!NOTIFY || navigator.webdriver || /HeadlessChrome/.test(navigator.userAgent)) return;
  try { if (localStorage.getItem("svitlo-me")) return; } catch (e) {}
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} };
  const visitNo = (+store("svitlo-visits") || 0) + 1;
  store("svitlo-visits", String(visitNo));
  if (!store("svitlo-first")) store("svitlo-first", new Date().toLocaleDateString("uk-UA", { timeZone: TZ }));
  const visit = () => ({
    visitNo, firstSeen: visitNo > 1 ? store("svitlo-first") : "", referrer: document.referrer, from: qs.get("from") || "",
    openedAt: new Date().toISOString(), state: ($("h1") && $("h1").textContent) || "",
  });
  const seconds = () => Math.round((TR.visible + (TR.since ? Date.now() - TR.since : 0)) / 1000);
  addEventListener("scroll", () => {
    const h = document.documentElement.scrollHeight - innerHeight;
    TR.scroll = Math.max(TR.scroll, h > 0 ? Math.round((scrollY / h) * 100) : 100);
  }, { passive: true });
  const update = () => {
    if (!TR.ref) return;
    const body = JSON.stringify({ ref: TR.ref, visit: visit(), activity: { seconds: seconds(), scroll: TR.scroll, clicks: [...TR.clicks] } });
    navigator.sendBeacon(NOTIFY + "/update", new Blob([body], { type: "text/plain" }));
  };
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (TR.since) TR.visible += Date.now() - TR.since; TR.since = 0; update(); }
    else TR.since = Date.now();
  });
  addEventListener("pagehide", update);
  // відкриття рахуємо, коли сторінку реально видно 3 с (прев'ю посилань і сканери так не роблять)
  const go = () => {
    if (TR.sent || document.hidden) return;
    TR.sent = true;
    fetch(NOTIFY + "/visit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ visit: visit() }) })
      .then((r) => r.json()).then((d) => { if (d && d.ref) TR.ref = d.ref; }).catch(() => {});
  };
  const arm = () => setTimeout(() => { if (!document.hidden) go(); else document.addEventListener("visibilitychange", arm, { once: true }); }, 3000);
  arm();
})();

/* ---------- події ---------- */
document.querySelectorAll("#per button").forEach((b) => (b.onclick = () => { period = +b.dataset.p; if (period !== 7) tclick(period ? "p30" : "pall"); selDay = null; showAll = false; render(); }));
document.querySelectorAll("#schedTabs button").forEach((b) => (b.onclick = () => { schedDay = +b.dataset.d; if (schedDay) tclick("tomorrow"); render(); }));
$("refresh").onclick = () => { tclick("refresh"); load(true); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
const TG_RE = /^https:\/\/t\.me\/[\w+\/-]+$/;
const TG_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.56 8.16-1.97 9.28c-.15.66-.54.82-1.09.51l-3-2.21-1.45 1.39c-.16.16-.29.29-.6.29l.21-3.05 5.56-5.02c.24-.21-.05-.33-.37-.12l-6.87 4.33-2.96-.92c-.64-.2-.66-.64.14-.95l11.57-4.46c.54-.2 1.01.13.83.93z"/></svg>`;
// рядок унизу в стилі GitHub-посилання: іконка Telegram + ім'я каналу/чату + пояснення
function footLink(url, note, click) {
  const row = document.createElement("span"); row.className = "fl";
  const a = document.createElement("a"); a.className = "gh"; a.href = url; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = TG_ICON; a.append(url.replace(/^https:\/\/t\.me\//, ""));
  if (click) a.onclick = () => tclick(click);
  row.append(a, ` — ${note}`);
  $("flinks").append(row);
}
(function labels() {
  const grp = C.group ? `група ${C.group}` : "";
  $("bT").textContent = C.title;
  $("bG").textContent = grp ? `· ${grp}` : "";
  document.title = [C.title, grp].filter(Boolean).join(" · ");
  const f = ["Неофіційна сторінка мешканців."];
  if (HAS_HOME) f.push(`Факт відключення — ${C.sensorNote} (оновлення щохвилини, коли вдома є інтернет).`);
  f.push(`Графік — ${[C.provider, grp].filter(Boolean).join(", ") || "відкриті дані outage-data-ua"}.`);
  $("fnote").textContent = f.join(" ");
  if (TG_RE.test(C.chatUrl)) {
    const a = $("chat");
    a.href = C.chatUrl; a.hidden = false;
    a.onclick = () => tclick("chat");
    a.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path fill="#fff" d="M5.4 11.7l11.2-4.3c.5-.2 1 .1.8.9l-1.9 9c-.1.6-.5.8-1 .5l-2.9-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-2.9 5.3-4.8c.2-.2 0-.3-.3-.1l-6.6 4.1-2.8-.9c-.6-.2-.6-.6.1-.9z"/></svg>`;
    a.append(C.chatName || "Чат будинку в Telegram");
    footLink(C.chatUrl, "чат будинку: новини й обговорення", "chat");
  }
  if (HAS_HOME && C.emergencyName && TG_RE.test(C.emergencyUrl)) footLink(C.emergencyUrl, `канал «${C.emergencyName}», звідки беремо дані про екстрені відключення`, "avariika");
})();
if (HAS_HOME && !DATA_LOCAL) try { const c = JSON.parse(localStorage.getItem(CACHE)); if (c && c.v === 1) { D = c; render(); } } catch (e) {}
load();
setInterval(load, 60000);
setInterval(render, 30000);
</script>
